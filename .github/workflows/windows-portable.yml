name: Build Windows Portable EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      QT_VERSION: 6.8.3
      BUILD_DIR: build
      DIST_DIR: dist/AdaptiveTextureOptimizer-40-Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning qtshadertools
          cache: true

      - name: Install web interface dependencies
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build React WebGL interface
        shell: pwsh
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Create Windows cinematic interface icon
        shell: pwsh
        run: ./tools/create_icon.ps1 -OutputPath ./assets/liquid.ico

      - name: Configure release
        shell: pwsh
        run: >-
          cmake -S . -B $env:BUILD_DIR -G "Visual Studio 17 2022"
          -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --parallel

      - name: Create portable directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:DIST_DIR | Out-Null
          Copy-Item "$env:BUILD_DIR/Release/AdaptiveTextureOptimizer.exe" $env:DIST_DIR
          Copy-Item "README.md" $env:DIST_DIR
          Copy-Item "THIRD_PARTY_NOTICES.md" $env:DIST_DIR
          & "${env:QT_ROOT_DIR}/bin/windeployqt.exe" `
            --release `
            --compiler-runtime `
            "$env:DIST_DIR/AdaptiveTextureOptimizer.exe"

      - name: Smoke-test package
        shell: pwsh
        run: |
          $exe = "$env:DIST_DIR/AdaptiveTextureOptimizer.exe"
          if (!(Test-Path $exe)) { throw "EXE was not created" }
          $required = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Qml.dll", "Qt6Quick.dll")
          foreach ($dll in $required) {
            if (!(Test-Path "$env:DIST_DIR/$dll")) { throw "Missing $dll" }
          }
          Get-ChildItem $env:DIST_DIR -Recurse | ForEach-Object {
            if ($_.FullName.Length -gt 240) { throw "Path is too long: $($_.FullName)" }
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $env:QTWEBENGINE_CHROMIUM_FLAGS = "--use-angle=swiftshader --disable-gpu-sandbox --no-sandbox"
          $env:AGR_STARTUP_TEST = "1"
          foreach ($attempt in 1..3) {
            $stdout = "$pwd/dist/startup-stdout-$attempt.log"
            $stderr = "$pwd/dist/startup-stderr-$attempt.log"
            $process = Start-Process -FilePath $exe `
              -WorkingDirectory $env:DIST_DIR `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru
            Start-Sleep -Seconds 5
            $startupLog = "$env:DIST_DIR/AdaptiveTextureOptimizer-startup.log"
            $startupText = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { "" }
            if ($process.HasExited) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              if ($startupText) { Write-Host $startupText }
              throw "Application exited during startup attempt $attempt with code $($process.ExitCode)"
            }
            if ($startupText -match "\[CRITICAL\]|failed to load component") {
              Stop-Process -Id $process.Id -Force
              Write-Host $startupText
              throw "QML startup diagnostics reported a fatal error on attempt $attempt"
            }
            Stop-Process -Id $process.Id -Force
          }

      - name: Test RGB24 optimization pipeline
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $selfTest = Start-Process `
            -FilePath "$env:DIST_DIR/AdaptiveTextureOptimizer.exe" `
            -ArgumentList "--self-test" `
            -WorkingDirectory $env:DIST_DIR `
            -Wait `
            -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Optimizer self-test failed with code $($selfTest.ExitCode)" }

      - name: Test all UI layouts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $env:AGR_STARTUP_TEST = "1"
          $uiTest = Start-Process `
            -FilePath "$env:DIST_DIR/AdaptiveTextureOptimizer.exe" `
            -ArgumentList "--ui-layout-test" `
            -WorkingDirectory $env:DIST_DIR `
            -Wait `
            -PassThru
          if ($uiTest.ExitCode -ne 0) { throw "UI layout test failed with code $($uiTest.ExitCode)" }

      - name: Pack portable application
        shell: pwsh
        run: Compress-Archive -Path "$env:DIST_DIR/*" -DestinationPath "dist/AdaptiveTextureOptimizer-40-Windows-Portable.zip" -CompressionLevel Optimal

      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v7
        with:
          name: AdaptiveTextureOptimizer-40-Windows-Portable
          path: dist/AdaptiveTextureOptimizer-40-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
